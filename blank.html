<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPA Signer</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0b0f;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(680px,calc(100% - 32px));margin:0 auto;padding:54px 0 80px}h1{text-align:center;font-size:44px;margin:0 0 10px}.sub{text-align:center;color:#aaa;margin:0 0 34px}.card{background:#14141b;border:1px solid #ffffff14;border-radius:22px;padding:22px;margin:14px 0}label{display:block;font-weight:700;margin-bottom:10px}.drop{display:block;padding:28px 18px;border:1.5px dashed #ffffff35;border-radius:16px;text-align:center;color:#aaa;cursor:pointer}.drop:hover{border-color:#e53232}.name{font-size:13px;color:#aaa;margin-top:9px;min-height:18px}input[type=password]{width:100%;padding:15px;border-radius:12px;border:1px solid #ffffff1c;background:#0c0c10;color:#fff;font-size:16px}.btn{width:100%;border:0;border-radius:15px;padding:17px;background:#e53232;color:white;font-weight:800;font-size:17px;cursor:pointer;margin-top:8px}.btn:disabled{opacity:.45;cursor:not-allowed}.status{text-align:center;color:#aaa;min-height:24px;margin:18px 0 0;font-size:14px}.fallback{display:none;text-align:center;margin-top:16px}.fallback a{display:inline-block;background:#202028;color:#fff;padding:13px 18px;border-radius:12px;text-decoration:none;font-weight:700}.note{font-size:13px;color:#777;line-height:1.5;text-align:center;margin-top:20px}</style></head><body><main class="wrap"><h1>IPA Signer</h1><p class="sub">Upload your IPA and signing files.</p><div class="card"><label for="ipa">IPA file</label><label class="drop"><input id="ipa" type="file" accept=".ipa" hidden><span>Tap to choose an .ipa file</span><div class="name" id="ipaName"></div></label></div><div class="card"><label for="p12">Certificate (.p12)</label><label class="drop"><input id="p12" type="file" accept=".p12,.pfx" hidden><span>Tap to choose your certificate</span><div class="name" id="p12Name"></div></label><div style="height:16px"></div><label for="password">Certificate password</label><input id="password" type="password" placeholder="Enter password"></div><div class="card"><label for="profile">Provisioning profile</label><label class="drop"><input id="profile" type="file" accept=".mobileprovision" hidden><span>Tap to choose .mobileprovision</span><div class="name" id="profileName"></div></label></div><button class="btn" id="sign" disabled>Sign IPA</button><div class="status" id="status">Select all required files to continue.</div><div class="fallback" id="fallback"><a href="https://flarestore.app/signer/" target="_blank" rel="noopener">Open FlareStore Web Signer</a></div><p class="note">Your certificate and password are sent to the configured signing service only when you press Sign IPA. Use certificates you own or are authorized to use.</p></main><script>const MAX=500*1024*1024,ids=['ipa','p12','profile'],status=document.getElementById('status'),sign=document.getElementById('sign'),fallback=document.getElementById('fallback');function refresh(){ids.forEach(id=>document.getElementById(id+'Name').textContent=document.getElementById(id).files[0]?.name||'');sign.disabled=!ids.every(id=>document.getElementById(id).files.length)&&true;sign.disabled=!ids.every(id=>document.getElementById(id).files.length)}ids.forEach(id=>document.getElementById(id).addEventListener('change',refresh));sign.onclick=async()=>{const ipa=document.getElementById('ipa').files[0],p12=document.getElementById('p12').files[0],profile=document.getElementById('profile').files[0];fallback.style.display='none';if(!ipa||!p12||!profile)return;if(ipa.size>MAX){status.textContent='IPA is too large. Maximum size is 500 MB.';return}sign.disabled=true;status.textContent='Uploading and signing…';const fd=new FormData();fd.append('ipa',ipa);fd.append('p12',p12);fd.append('provision',profile);fd.append('p12_password',document.getElementById('password').value);try{const r=await fetch('https://flarestore.app/api/sign',{method:'POST',body:fd});if(!r.ok){let msg='Signing service returned HTTP '+r.status;try{const j=await r.json();if(j.error)msg=j.error}catch{}throw new Error(msg)}const blob=await r.blob(),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='signed-'+ipa.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);status.textContent='Signing complete. Download should start.'}catch(e){status.textContent='Could not connect to the signing service. The browser-to-API connection is being blocked or the service is unavailable.';fallback.style.display='block'}finally{refresh()}};refresh();</script></body></html>
