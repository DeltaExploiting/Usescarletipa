<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPA Signer</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0b0f;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(680px,calc(100% - 32px));margin:0 auto;padding:54px 0 80px}h1{text-align:center;font-size:44px;margin:0 0 10px}.sub{text-align:center;color:#aaa;margin:0 0 34px}.card{background:#14141b;border:1px solid #ffffff14;border-radius:22px;padding:22px;margin:14px 0}label{display:block;font-weight:700;margin-bottom:10px}.drop{display:block;padding:28px 18px;border:1.5px dashed #ffffff35;border-radius:16px;text-align:center;color:#aaa;cursor:pointer}.drop:hover{border-color:#e53232}.name{font-size:13px;color:#aaa;margin-top:9px;min-height:18px}input[type=password]{width:100%;padding:15px;border-radius:12px;border:1px solid #ffffff1c;background:#0c0c10;color:#fff;font-size:16px}.btn{width:100%;border:0;border-radius:15px;padding:17px;background:#e53232;color:white;font-weight:800;font-size:17px;cursor:pointer;margin-top:8px}.btn:disabled{opacity:.45;cursor:not-allowed}.status{text-align:center;color:#aaa;min-height:24px;margin:18px 0 0;font-size:14px}.note{font-size:13px;color:#777;line-height:1.5;text-align:center;margin-top:20px}.progress{width:100%;height:7px;background:#22232b;border-radius:99px;overflow:hidden;margin-top:14px;display:none}.bar{height:100%;width:0;background:#e53232;transition:width .2s}</style></head><body><main class="wrap"><h1>IPA Signer</h1><p class="sub">Upload your IPA and signing files. Maximum IPA size: 500 MB.</p><div class="card"><label for="ipa">IPA file</label><label class="drop"><input id="ipa" type="file" accept=".ipa" hidden><span>Tap to choose an .ipa file</span><div class="name" id="ipaName"></div></label></div><div class="card"><label for="p12">Certificate (.p12)</label><label class="drop"><input id="p12" type="file" accept=".p12,.pfx" hidden><span>Tap to choose your certificate</span><div class="name" id="p12Name"></div></label><div style="height:16px"></div><label for="password">Certificate password</label><input id="password" type="password" placeholder="Enter password"></div><div class="card"><label for="profile">Provisioning profile</label><label class="drop"><input id="profile" type="file" accept=".mobileprovision" hidden><span>Tap to choose .mobileprovision</span><div class="name" id="profileName"></div></label></div><button class="btn" id="sign" disabled>Sign IPA</button><div class="progress" id="progress"><div class="bar" id="bar"></div></div><div class="status" id="status">Select all required files to continue.</div><p class="note">Your IPA, certificate, provisioning profile, and password are sent to the configured signing API only when you press Sign IPA. Use only credentials you own.</p></main><script>const MAX=500*1024*1024,API='https://flarestore.app/api/sign',ids=['ipa','p12','profile'],status=document.getElementById('status'),sign=document.getElementById('sign'),progress=document.getElementById('progress'),bar=document.getElementById('bar');function refresh(){ids.forEach(id=>document.getElementById(id+'Name').textContent=document.getElementById(id).files[0]?.name||'');const ipa=document.getElementById('ipa').files[0];sign.disabled=!ids.every(id=>document.getElementById(id).files.length)||!!ipa&&ipa.size>MAX;if(ipa&&ipa.size>MAX)status.textContent='IPA is too large. Maximum size is 500 MB.'}ids.forEach(id=>document.getElementById(id).addEventListener('change',refresh));sign.onclick=async()=>{const ipa=document.getElementById('ipa').files[0],p12=document.getElementById('p12').files[0],profile=document.getElementById('profile').files[0];if(!ipa||!p12||!profile)return;if(ipa.size>MAX){status.textContent='IPA is too large. Maximum size is 500 MB.';return}sign.disabled=true;progress.style.display='block';bar.style.width='5%';status.textContent='Uploading and signing…';const fd=new FormData();fd.append('ipa',ipa);fd.append('p12',p12);fd.append('provision',profile);fd.append('p12_password',document.getElementById('password').value);try{const r=await fetch(API,{method:'POST',body:fd});bar.style.width='90%';if(!r.ok){let msg='Signing service returned an error.';try{const j=await r.json();msg=j.error||msg}catch{}if(r.status===413)msg='IPA is too large. Maximum size is 500 MB.';throw new Error(msg)}const blob=await r.blob(),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='signed-'+ipa.name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);bar.style.width='100%';status.textContent='Signing complete. Your signed IPA download should start.'}catch(e){status.textContent='Signing failed: '+(e.message||'Unable to reach the signing service.');bar.style.width='0'}finally{refresh()}};refresh();</script></body></html>
